<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gantt Chart Demo</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 20px;
      background: #f5f5f5;
    }
    h1 {
      color: #333;
    }
    .container {
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "lit": "https://esm.sh/lit@3.1.0",
        "lit/": "https://esm.sh/lit@3.1.0/",
        "@lit/reactive-element": "https://esm.sh/@lit/reactive-element@2.0.4",
        "lit-html": "https://esm.sh/lit-html@3.1.0",
        "lit-element/lit-element.js": "https://esm.sh/lit-element@4.0.4/lit-element.js"
      }
    }
  </script>
  <script type="module" src="./dist/index.js"></script>
</head>
<body>
  <h1>Gantt Chart Demo - プロジェクト管理</h1>

  <div class="container">
    <gantt-chart first-day="2025-10-01" working-days="月,火,水,木,金" locale="ja-JP" timezone="Asia/Tokyo">
      <!-- タスク定義 -->
      <gantt-task id="A" name="要件定義" duration="3" assignee="佐藤"></gantt-task>
      <gantt-task id="B" name="UI設計" duration="4" assignee="鈴木">
        <depends-on task="A"></depends-on>
      </gantt-task>
      <gantt-task id="C" name="API設計" duration="5" assignee="田中">
        <depends-on task="A"></depends-on>
      </gantt-task>
      <gantt-task id="D" name="実装" duration="8" assignee="山本">
        <depends-on task="B"></depends-on>
        <depends-on task="C"></depends-on>
      </gantt-task>
      <gantt-task id="M" name="リリース" duration="0" assignee="PM">
        <depends-on task="D"></depends-on>
      </gantt-task>

      <!-- カレンダー（祝祭日等） -->
      <gantt-calendar>
        <holiday date="2025-10-13" label="スポーツの日"></holiday>
        <closed from="2025-12-28" to="2026-01-05" label="年末年始"></closed>
        <workday date="2025-10-12" label="特別稼働日"></workday>
      </gantt-calendar>

      <!-- アンカー：Aの1日目=2025-10-06、Dの5日目=2025-11-04（全体の基準） -->
      <gantt-anchors>
        <anchor task="A" day="1" date="2025-10-06"></anchor>
        <anchor task="D" day="5" date="2025-11-04"></anchor>
      </gantt-anchors>
    </gantt-chart>
  </div>

  <div class="container" style="margin-top: 20px;">
    <h2>説明</h2>
    <ul>
      <li><strong>アンカー方式:</strong> タスクAの1日目を2025-10-06に、タスクDの5日目を2025-11-04に固定</li>
      <li><strong>営業日:</strong> 月〜金（土日を除く）</li>
      <li><strong>祝日:</strong> 2025-10-13（スポーツの日）</li>
      <li><strong>年末年始:</strong> 2025-12-28〜2026-01-05は非営業日</li>
      <li><strong>特別稼働日:</strong> 2025-10-12（日曜日だが営業日として扱う）</li>
      <li><strong>依存関係:</strong> B→A, C→A, D→B+C（AND条件）, M→D</li>
    </ul>
  </div>
</body>
</html>
